<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Dashboard</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --text: #1d1d1b; --muted: #6b6a66;
  --border: #e2dfd8; --accent: #2f6fdb; --accent-soft: #e6eefc; --danger: #c43d3d; --ok: #2e8b57;
  --career: #5b5bd6; --amazon: #d9822b; --kids: #d6409f; --fitness: #2e8b57; --house: #2f8f9d;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1e1e1c; --surface-2: #262624; --text: #ecebe7; --muted: #9b9a95;
    --border: #34332f; --accent: #6b9cf0; --accent-soft: #23304a; --danger: #e06c6c; --ok: #4fbf82;
    --career: #8f8ff0; --amazon: #eba25a; --kids: #ea78c0; --fitness: #4fbf82; --house: #5ab8c6;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1e1e1c; --surface-2: #262624; --text: #ecebe7; --muted: #9b9a95;
  --border: #34332f; --accent: #6b9cf0; --accent-soft: #23304a; --danger: #e06c6c; --ok: #4fbf82;
  --career: #8f8ff0; --amazon: #eba25a; --kids: #ea78c0; --fitness: #4fbf82; --house: #5ab8c6;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
header h1 { font-size: 20px; margin: 0; }
header .date { color: var(--muted); font-size: 14px; }
nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
nav button {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px;
}
nav button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.cards .card + .card { margin-top: 0; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow); min-width: 0;
}
.card + .card, .stack > * + * { margin-top: 12px; }
.grid > .card + .card { margin-top: 0; }
.area-card { cursor: pointer; border-left: 4px solid var(--c, var(--accent)); }
.area-card:hover { border-color: var(--c); }
.area-card .label { font-size: 13px; color: var(--muted); }
.area-card .big { font-size: 22px; font-weight: 650; margin: 2px 0; }
.area-card .sub { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 140px; min-width: 0; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 9px; min-width: 0;
}
input[type="number"] { width: 90px; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
button.btn, label.btn {
  font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.icon { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 15px; border-radius: 6px; }
button.icon:hover { background: var(--surface-2); color: var(--text); }
button.icon.on { color: #e0a100; }
ul.list { list-style: none; margin: 8px 0 0; padding: 0; }
ul.list li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); }
ul.list li:first-child { border-top: 0; }
ul.list li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
ul.list li.done .t { text-decoration: line-through; color: var(--muted); }
.tag { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.late { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 6px 0; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 999px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.week button {
  font: inherit; font-size: 13px; padding: 10px 0; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
}
.week button.on { background: var(--fitness); border-color: var(--fitness); color: #fff; }
.week button.today { outline: 2px solid var(--text); outline-offset: 1px; }
.bigbtn { width: 100%; padding: 16px; font-size: 17px; font-weight: 600; border-radius: 12px; cursor: pointer; border: 0; background: var(--fitness); color: #fff; font-family: inherit; }
.bigbtn.done { background: var(--surface-2); color: var(--muted); }
.table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; }
.table th, .table td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--border); vertical-align: middle; }
.table th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
.table input, .table select { width: 100%; min-width: 64px; padding: 5px 6px; }
.scroll-x { overflow-x: auto; }
.stat { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
.stat b { font-variant-numeric: tabular-nums; }
.pos { color: var(--ok); } .neg { color: var(--danger); }
.hint { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
footer { margin: 28px 0 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Life Dashboard</h1>

  <footer>
    <span id="storageNote">데이터는 이 브라우저에만 저장돼요.</span>

/* ---------- date helpers ---------- */

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

  return [...Array(7)].map((_, i) => fmt(addDays(monday, i)));

// Fill rent/due day into the placeholder tenants saved before those fields existed.
function migrate(s) {
  const presets = { '테넌트 1': [780, 1], '테넌트 2': [700, 27] };
  for (const t of s.house.tenants) {
    const p = presets[t.name];
    if (p && !Number(t.rent)) t.rent = p[0];
    if (p && !t.dueDay) t.dueDay = p[1];
  }
  // Swap the original generic checklist for the UK one if it was never touched.
  const st = s.house.steps;
  if (st.length === OLD_TENANT_STEPS.length && st.every((x, i) => x.title === OLD_TENANT_STEPS[i] && !x.done)) {
    s.house.steps = steps(TENANT_STEPS);
  }
  // Level I is already passed: move an untouched Level I tracker to Level II.
  const c = s.career.cfa;
  if (c.level === 'Level I' && !c.log.length && !c.examDate && c.topics.every(t => !t.progress)) {
    Object.assign(c, { level: 'Level II', targetHours: 350, topics: CFA_TOPICS.map(([name, weight]) => ({ id: uid(), name, weight, progress: 0 })) });
  }
  if (!s.career.goals.length) s.career.goals = CAREER_GOALS.map(([title, progress]) => ({ id: uid(), title, progress }));
  return s;
}
function deepMerge(base, saved) {
  for (const k in saved) {
    const v = saved[k];
    base[k] = v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])
      ? deepMerge(base[k], v) : v;
  }
  return base;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  if (stateRef) { clearTimeout(saveTimer); saveTimer = setTimeout(saveRemote, 800); }
}
// One write at a time; a save requested mid-write runs once it finishes.
async function saveRemote() {
  if (saving) { saveAgain = true; return; }
  saving = true;
  try { await stateRef.set({ json: JSON.stringify(state), savedAt: new Date().toISOString() }); }
  catch (e) { document.getElementById('storageNote').textContent = '저장 실패 — 이 브라우저에만 저장됐어요.'; }
  saving = false;
  if (saveAgain) { saveAgain = false; saveRemote(); }
}

function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  return new Date(y, Math.floor((h + l - 7 * m + 114) / 31) - 1, ((h + l - 7 * m + 114) % 31) + 1);
}
function occIn(rule, y) {
  if (rule.t === 'fixed') return fmt(new Date(y, rule.m - 1, rule.d));
  if (rule.t === 'nth') {
    const first = new Date(y, rule.m - 1, 1);
    return fmt(new Date(y, rule.m - 1, 1 + ((rule.wd - first.getDay() + 7) % 7) + (rule.n - 1) * 7));
  }
  if (rule.t === 'easter') return fmt(addDays(easter(y), rule.off));
  return null;
}
function nextOcc(ev) {
  const now = today();
  if (ev.rule.t === 'dates') return [...ev.rule.dates].sort().find(d => d >= now) || null;
  const y = new Date().getFullYear();
  return [y, y + 1].map(yy => occIn(ev.rule, yy)).find(d => d >= now) || null;
}

      <div class="stack">
        <div class="card"><h3>교육 · 발달 타임라인</h3>
          <div class="small muted">2주 전부터 오늘 탭에 떠요. 영국 일반 일정 기준이라 날짜는 카운슬·너서리 안내로 확인하세요.</div>
          <ul class="list">${ms.map(m => milestoneItem(m)).join('')}</ul>
          <form class="row" data-form="milestone" data-path="kids.milestones" style="margin-top:8px">
            <input type="date" name="date" required><input class="grow" name="title" placeholder="추가 (예: 너서리 학부모 상담)" required>
            <button class="btn primary">추가</button>
          </form>
        </div>
        ${notesPanel('kids', '성장 기록, 사이즈, 아이가 요즘 좋아하는 것, 같이 하고 싶은 것…')}
      </div>
    </div>`;
  },

  fitness() {
    const fs = fitnessStats(), now = today(), wk = weekDates();
    const names = ['월', '화', '수', '목', '금', '토', '일'];
    const doneToday = !!state.fitness.log[now];
    return `<div class="grid">
      <div class="stack">
        <div class="card">
          <button class="bigbtn${doneToday ? ' done' : ''}" data-action="workout" data-date="${now}">${doneToday ? '오늘 했음 ✓ (취소하려면 클릭)' : '오늘 운동했다!'}</button>
          <div class="small muted" style="margin-top:8px">최소 버전: <b>${esc(state.fitness.minimum)}</b> — 이것만 해도 체크하세요. 0일보다 10분이 낫습니다.</div>
          <div class="row" style="justify-content:space-between;margin-top:12px"><b>이번 주</b><span class="small muted">${fs.week} / ${fs.goal}회</span></div>
          ${bar(Math.min(100, pct(fs.week, fs.goal)), 'fitness')}
          <div class="week">${wk.map((d, i) => `<button class="${state.fitness.log[d] ? 'on' : ''}${d === now ? ' today' : ''}" data-action="workout" data-date="${d}">${names[i]}</button>`).join('')}</div>
        </div>
        <div class="card">
          <div class="stat"><span>연속 기록</span><b>${fs.streak}일</b></div>
          <div class="stat"><span>이번 달</span><b>${fs.month}회</b></div>
        </div>
      </div>
      <div class="stack">
        <div class="card"><h3>설정</h3>
          <div class="stack">
            <label class="row small">주간 목표 <input type="number" min="1" max="7" data-setting="fitness.goalPerWeek" value="${esc(state.fitness.goalPerWeek)}"> 회</label>
            <label class="small">최소 버전 (하기 싫은 날 기준)<input style="width:100%;margin-top:4px" data-setting="fitness.minimum" value="${esc(state.fitness.minimum)}"></label>
          </div>
          <div class="hint">처음엔 주 2회로 시작해서 4주 연속 달성하면 1회씩 올리세요.</div>
        </div>
        ${taskPanel('fitness')}
      </div>
    </div>`;
  },

  house() {
    const hs = houseStats(), m = thisMonth(), T = 'house.tenants', C = 'house.candidates';
    const target = Number(state.house.targetRent) || 0;
    return `<div class="grid">
      <div class="stack">
        <div class="card"><h3>테넌트 · ${m} 월세</h3>
          <div class="scroll-x"><table class="table">
            <tr><th>이름</th><th>방</th><th>월세 (${CURRENCY})</th><th>입금일</th><th>계약 만료</th><th>입금</th><th></th></tr>
            ${state.house.tenants.map(t => {
              const soon = t.leaseEnd && t.leaseEnd <= fmt(addDays(new Date(), 60));
              return `<tr>
                <td style="min-width:100px">${editInput(T, t, 'name')}</td>
                <td style="min-width:60px">${editInput(T, t, 'room')}</td>
                <td>${editInput(T, t, 'rent', 'number')}</td>
                <td>${editInput(T, t, 'dueDay', 'number', 'min="1" max="31"')}</td>
                <td style="min-width:130px">${editInput(T, t, 'leaseEnd', 'date', soon ? 'style="border-color:var(--danger)" title="60일 내 만료"' : '')}</td>
                <td><input type="checkbox" data-action="toggle-rent" data-id="${t.id}" ${t.paid && t.paid[m] ? 'checked' : ''}></td>
                <td><button class="icon" data-action="del-item" data-path="${T}" data-id="${t.id}">✕</button></td></tr>`;
            }).join('')}
          </table></div>
          <button class="btn" data-action="add-tenant" style="margin-top:8px">+ 테넌트</button>
          <div class="stat" style="margin-top:8px"><span>월세 합계 (현재)</span><b>${money(hs.rentTotal)}</b></div>
          <div class="stat"><span>입금 완료</span><b>${hs.paid} / ${hs.count}</b></div>
          <div class="stat"><span>3번째 테넌트 목표 월세 (${CURRENCY})</span><input type="number" data-setting="house.targetRent" value="${esc(state.house.targetRent)}"></div>
          ${target ? `<div class="stat muted small"><span>3명 기준 예상 월 수입</span><b>${money(hs.rentTotal + target)}</b></div>` : ''}
        </div>
        <div class="card"><h3>3번째 테넌트 후보</h3>
          <div class="scroll-x"><table class="table">
            <tr><th>이름</th><th>연락처</th><th>단계</th><th>메모</th><th></th></tr>
            ${state.house.candidates.map(c => `<tr>
              <td style="min-width:90px">${editInput(C, c, 'name')}</td>
              <td style="min-width:110px">${editInput(C, c, 'contact')}</td>
              <td style="min-width:100px"><select data-path="${C}" data-id="${c.id}" data-field="stage">${options(CANDIDATE_STAGES, c.stage)}</select></td>
              <td style="min-width:120px">${editInput(C, c, 'memo')}</td>
              <td><button class="icon" data-action="del-item" data-path="${C}" data-id="${c.id}">✕</button></td></tr>`).join('')}
          </table></div>
          ${state.house.candidates.length ? '' : '<div class="empty">문의 오면 여기에 추가</div>'}
          <button class="btn" data-action="add-candidate" style="margin-top:8px">+ 후보</button>
        </div>
      </div>
      <div class="stack">
        ${checklist('house.steps', 'house', '3번째 테넌트 준비')}
        ${taskPanel('house', '수리 / 관리 할 일')}
        ${notesPanel('house', '하우스 룰, 유틸리티 계정, 수리 업체 연락처…')}
      </div>
    </div>`;
  },
};

/* ---------- render ---------- */
function render() {
  const d = new Date();
  document.getElementById('today').textContent =
    d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  document.getElementById('tabs').innerHTML = Object.entries(TABS).map(([k, t]) =>
    `<button class="${state.tab === k ? 'active' : ''}" data-action="go" data-tab="${k}">${t.icon} ${t.label}</button>`).join('');
  document.getElementById('main').innerHTML = (VIEWS[state.tab] || VIEWS.today)();
}
function commit() { save(); render(); }
let renderPending = false;
function renderWhenIdle() {
  const a = document.activeElement;
  if (a && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) renderPending = true;
  else render();
}
document.addEventListener('focusout', () => { if (renderPending) { renderPending = false; setTimeout(render, 0); } });
const findIn = (path, id) => getPath(path).find(x => x.id === id);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id, path } = el.dataset;
  switch (action) {
    case 'go': state.tab = el.dataset.tab; window.scrollTo(0, 0); break;
    case 'toggle-task': { const t = state.tasks.find(x => x.id === id); t.done = !t.done; if (t.done) t.focus = false; break; }
    case 'focus-task': {
      const t = state.tasks.find(x => x.id === id);
      if (!t.focus && state.tasks.filter(x => x.focus && !x.done).length >= FOCUS_LIMIT) {
        alert(`오늘 집중은 ${FOCUS_LIMIT}개까지만! 하나를 끝내거나 빼고 추가하세요.`); return;
      }
      t.focus = !t.focus; break;
    }
    case 'del-task': state.tasks = state.tasks.filter(x => x.id !== id); break;
    case 'toggle-step': { const s = findIn(path, id); s.done = !s.done; break; }
    case 'del-item': {
      if (!confirm('삭제할까요?')) return;
      const arr = getPath(path); arr.splice(arr.findIndex(x => x.id === id), 1); break;
    }
    case 'workout': { const d = el.dataset.date; state.fitness.log[d] = !state.fitness.log[d]; if (!state.fitness.log[d]) delete state.fitness.log[d]; break; }
    case 'add-product': state.amazon.products.push({ id: uid(), name: '', stage: PRODUCT_STAGES[0], cost: '', fee: '', price: '' }); break;
    case 'add-tenant': state.house.tenants.push({ id: uid(), name: '', room: '', rent: 0, dueDay: 1, leaseEnd: '', paid: {} }); break;
    case 'add-candidate': state.house.candidates.push({ id: uid(), name: '', contact: '', stage: CANDIDATE_STAGES[0], memo: '' }); break;
    case 'toggle-rent': { const t = findIn('house.tenants', id), m = thisMonth(); t.paid = t.paid || {}; t.paid[m] = !t.paid[m]; break; }
    case 'prep-event': { const k = el.dataset.key; state.kids.prepared[k] = !state.kids.prepared[k]; break; }
    case 'export': return exportData();
    case 'theme': return toggleTheme();
    default: return;
  }
  commit();
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), v = Object.fromEntries(fd);
  switch (f.dataset.form) {
    case 'task': state.tasks.push({ id: uid(), area: f.dataset.area, title: v.title.trim(), due: v.due, done: false, focus: false }); break;
    case 'quick': {
      const wantFocus = !!v.focus && state.tasks.filter(x => x.focus && !x.done).length < FOCUS_LIMIT;
      state.tasks.push({ id: uid(), area: v.area, title: v.title.trim(), due: v.due, done: false, focus: wantFocus });
      break;
    }
    case 'step': getPath(f.dataset.path).push({ id: uid(), title: v.title.trim(), done: false }); break;
    case 'goal': state.career.goals.push({ id: uid(), title: v.title.trim(), progress: 0 }); break;
    case 'ledger': state.amazon.ledger.push({ id: uid(), date: v.date, type: v.type, amount: Number(v.amount), memo: v.memo.trim() }); break;
    case 'event': state.kids.events.push({ id: uid(), date: v.date, time: v.time, title: v.title.trim() }); break;
    case 'win': state.career.wins.push({ id: uid(), date: v.date, text: v.text.trim() }); break;
    case 'cfa-log': state.career.cfa.log.push({ id: uid(), date: v.date, minutes: Number(v.minutes), topic: v.topic }); break;
    case 'milestone': getPath(f.dataset.path).push({ id: uid(), date: v.date, title: v.title.trim(), note: '', done: false }); break;
    case 'annual': {
      const [, m, d] = v.date.split('-').map(Number);
      state.kids.annual.push({ id: uid(), title: v.title.trim(), rule: { t: 'fixed', m, d }, lead: Number(v.lead) || 0, note: '' });
      break;
    }
    case 'block': {
      const days = fd.getAll('d').map(Number);
      if (!days.length) { alert('요일을 하나 이상 고르세요.'); return; }
      if (toMin(v.end) <= toMin(v.start)) { alert('끝나는 시간이 시작보다 늦어야 해요.'); return; }
      state.schedule.push({ id: uid(), days, start: v.start, end: v.end, area: v.area, title: v.title.trim() });
      openDetails.add('scheduleDetails');
      break;
    }
  }
  commit();
});

// Inline edits: update state without re-rendering on every keystroke, re-render on change.
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.notes) { state.notes[el.dataset.notes] = el.value; save(); return; }
  if (el.dataset.path && el.dataset.field) {
    const item = findIn(el.dataset.path, el.dataset.id);
    item[el.dataset.field] = el.type === 'number' || el.type === 'range' ? (el.value === '' ? '' : Number(el.value)) : el.value;
    save();
  }
  if (el.dataset.setting) {
    const keys = el.dataset.setting.split('.'), last = keys.pop();
    keys.reduce((o, k) => o[k], state)[last] = el.type === 'number' ? Number(el.value) : el.value;
    save();
  }
});
document.addEventListener('toggle', e => {
  const id = e.target.id;
  if (id && e.target.tagName === 'DETAILS') e.target.open ? openDetails.add(id) : openDetails.delete(id);
}, true);
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') return importData(el);
  if ((el.dataset.path && el.dataset.field) || el.dataset.setting) render();
});

/* ---------- backup / theme ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `life-dashboard-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  file.text().then(txt => {
    try {
      const data = JSON.parse(txt);
      if (!confirm('현재 데이터를 백업 파일로 덮어쓸까요?')) return;
      state = deepMerge(defaultState(), data);
      commit();
    } catch (err) { alert('백업 파일을 읽을 수 없어요.'); }
    input.value = '';
  });
}
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(KEY + '.theme', root.dataset.theme); } catch (e) { /* ignore */ }
}
try { const th = localStorage.getItem(KEY + '.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }

render();

// On claude.ai the page keeps its state in the account (synced across devices) and
// receives the FBA board summary; opened as a plain file it stays on localStorage.
(async () => {
  const db = await window.claude?.use?.('db') ?? null;
  const user = db && await window.claude.use('user');
  const id = user && await user.id();
  if (!id) return;
  const base = 'data/users/' + id;
  try {
    const snap = await db.doc(base + '/lifeState').get();
    stateRef = db.doc(base + '/lifeState');
    if (snap.exists) {
      const tab = state.tab;
      state = migrate(deepMerge(defaultState(), JSON.parse(snap.data().json)));
      state.tab = tab;
    } else {
      saveRemote();
    }
    document.getElementById('storageNote').textContent = 'claude.ai 계정에 저장돼요 (기기 간 동기화).';
    document.querySelectorAll('[data-action="export"], #importFile').forEach(el => (el.closest('label') || el).hidden = true);
    renderWhenIdle();
  } catch (e) { /* keep localStorage */ }
  db.doc(base + '/amazonSync').onSnapshot(s => {
    amazonSync = s.exists ? s.data() : null;
    renderWhenIdle();
  }, () => {});
})();
</script>
