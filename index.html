<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Dashboard</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --text: #1d1d1b; --muted: #6b6a66;
  --border: #e2dfd8; --accent: #2f6fdb; --accent-soft: #e6eefc; --danger: #c43d3d; --ok: #2e8b57;
  --career: #5b5bd6; --amazon: #d9822b; --kids: #d6409f; --fitness: #2e8b57; --house: #2f8f9d;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1e1e1c; --surface-2: #262624; --text: #ecebe7; --muted: #9b9a95;
    --border: #34332f; --accent: #6b9cf0; --accent-soft: #23304a; --danger: #e06c6c; --ok: #4fbf82;
    --career: #8f8ff0; --amazon: #eba25a; --kids: #ea78c0; --fitness: #4fbf82; --house: #5ab8c6;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1e1e1c; --surface-2: #262624; --text: #ecebe7; --muted: #9b9a95;
  --border: #34332f; --accent: #6b9cf0; --accent-soft: #23304a; --danger: #e06c6c; --ok: #4fbf82;
  --career: #8f8ff0; --amazon: #eba25a; --kids: #ea78c0; --fitness: #4fbf82; --house: #5ab8c6;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
header h1 { font-size: 20px; margin: 0; }
header .date { color: var(--muted); font-size: 14px; }
nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
nav button {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px;
}
nav button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 0 0 8px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.cards .card + .card { margin-top: 0; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow); min-width: 0;
}
.card + .card, .stack > * + * { margin-top: 12px; }
.grid > .card + .card { margin-top: 0; }
.area-card { cursor: pointer; border-left: 4px solid var(--c, var(--accent)); }
.area-card:hover { border-color: var(--c); }
.area-card .label { font-size: 13px; color: var(--muted); }
.area-card .big { font-size: 22px; font-weight: 650; margin: 2px 0; }
.area-card .sub { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 140px; min-width: 0; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 9px; min-width: 0;
}
input[type="number"] { width: 90px; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
button.btn, label.btn {
  font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.icon { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 15px; border-radius: 6px; }
button.icon:hover { background: var(--surface-2); color: var(--text); }
button.icon.on { color: #e0a100; }
ul.list { list-style: none; margin: 8px 0 0; padding: 0; }
ul.list li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); }
ul.list li:first-child { border-top: 0; }
ul.list li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
ul.list li.done .t { text-decoration: line-through; color: var(--muted); }
.tag { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.late { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 6px 0; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 999px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.week button {
  font: inherit; font-size: 13px; padding: 10px 0; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
}
.week button.on { background: var(--fitness); border-color: var(--fitness); color: #fff; }
.week button.today { outline: 2px solid var(--text); outline-offset: 1px; }
.bigbtn { width: 100%; padding: 16px; font-size: 17px; font-weight: 600; border-radius: 12px; cursor: pointer; border: 0; background: var(--fitness); color: #fff; font-family: inherit; }
.bigbtn.done { background: var(--surface-2); color: var(--muted); }
.table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 14px; }
.table th, .table td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--border); vertical-align: middle; }
.table th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
.table input, .table select { width: 100%; min-width: 64px; padding: 5px 6px; }
.scroll-x { overflow-x: auto; }
.stat { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
.stat b { font-variant-numeric: tabular-nums; }
.pos { color: var(--ok); } .neg { color: var(--danger); }
.hint { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
footer { margin: 28px 0 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Life Dashboard</h1>
    <span class="date" id="today"></span>
  </header>
  <nav id="tabs"></nav>
  <main id="main"></main>
  <footer>
    <span>데이터는 이 브라우저에만 저장돼요.</span>
    <button class="btn" data-action="export">백업 내보내기</button>
    <label class="btn" style="cursor:pointer">백업 불러오기<input type="file" id="importFile" accept="application/json" hidden></label>
    <button class="btn" data-action="theme">테마 전환</button>
  </footer>
</div>

<script>
const KEY = 'lifeDash.v1';
const AREAS = {
  career:  { label: '커리어',   icon: '💼' },
  amazon:  { label: '아마존',   icon: '📦' },
  kids:    { label: '육아',     icon: '👶' },
  fitness: { label: '운동',     icon: '🏃' },
  house:   { label: '집 관리',  icon: '🏠' },
};
const TABS = { today: { label: '오늘', icon: '☀️' }, ...AREAS };
const FOCUS_LIMIT = 3;

const AMAZON_STEPS = [
  'Seller Central 계정 등록 + 신원 인증',
  '세금 정보(W-9) / 은행 계좌 연결',
  '니치·제품 리서치 (경쟁·수요·마진)',
  '공급업체 찾기 + 샘플 주문',
  '원가·FBA 수수료·마진 계산 (아래 제품 표)',
  'UPC 바코드 (GS1) / 브랜드 등록',
  '리스팅 작성 (사진·타이틀·키워드)',
  'FBA 입고 배송 계획 생성 + 발송',
  '런칭 PPC 광고 세팅',
  '첫 리뷰 확보 (Vine 등)',
];
const TENANT_STEPS = [
  '방 상태 점검·청소·수리',
  '시세 조사 후 월세 결정',
  '기존 테넌트 2명에게 미리 공지',
  '공용공간·유틸리티 분담 규칙 정리',
  '지역 규정 확인 (거주 인원·임대 허가)',
  '리스팅 작성 + 사진 올리기',
  '문의 응대 / 쇼잉',
  '스크리닝 (신용·소득·레퍼런스)',
  '리스 계약 서명 + 보증금 수령',
  '입주 체크리스트 / 키 전달',
];
const PRODUCT_STAGES = ['아이디어', '리서치', '샘플', '발주', '입고중', '판매중', '보류'];
const CANDIDATE_STAGES = ['문의', '쇼잉 예정', '쇼잉 완료', '심사중', '승인', '계약 완료', '탈락'];

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const thisMonth = () => today().slice(0, 7);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekDates = () => {
  const now = new Date();
  const monday = addDays(now, -((now.getDay() + 6) % 7));
  return [...Array(7)].map((_, i) => fmt(addDays(monday, i)));
};
const shortDate = s => { const [, m, d] = s.split('-'); return `${+m}/${+d}`; };
const won = n => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });

/* ---------- state ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);
const steps = arr => arr.map(title => ({ id: uid(), title, done: false }));
function defaultState() {
  return {
    tab: 'today',
    tasks: [],
    notes: {},
    career: { goals: [] },
    amazon: { steps: steps(AMAZON_STEPS), products: [], ledger: [] },
    kids: { events: [] },
    fitness: { log: {}, goalPerWeek: 2, minimum: '10분 걷기 또는 스트레칭' },
    house: {
      tenants: [
        { id: uid(), name: '테넌트 1', room: '', rent: 0, leaseEnd: '', paid: {} },
        { id: uid(), name: '테넌트 2', room: '', rent: 0, leaseEnd: '', paid: {} },
      ],
      targetRent: 0,
      steps: steps(TENANT_STEPS),
      candidates: [],
    },
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return deepMerge(defaultState(), JSON.parse(raw));
  } catch (e) { /* storage unavailable */ }
  return defaultState();
}
function deepMerge(base, saved) {
  for (const k in saved) {
    const v = saved[k];
    base[k] = v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])
      ? deepMerge(base[k], v) : v;
  }
  return base;
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }
const getPath = p => p.split('.').reduce((o, k) => o[k], state);

/* ---------- html helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const areaVar = a => `--c: var(--${a})`;
const bar = (pct, area) => `<div class="bar" style="${area ? areaVar(area) : ''}"><i style="width:${Math.round(pct)}%"></i></div>`;
const pct = (n, d) => d ? (n / d) * 100 : 0;
const options = (list, sel) => list.map(o => `<option${o === sel ? ' selected' : ''}>${esc(o)}</option>`).join('');

function dueTag(t) {
  if (!t.due) return '';
  const late = !t.done && t.due < today();
  const label = t.due === today() ? '오늘' : shortDate(t.due);
  return `<span class="tag${late ? ' late' : ''}">${late ? '지남 · ' : ''}${label}</span>`;
}
function taskItem(t, showArea) {
  return `<li class="${t.done ? 'done' : ''}">
    <input type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done ? 'checked' : ''}>
    ${showArea ? `<span class="dot" style="${areaVar(t.area)}" title="${AREAS[t.area].label}"></span>` : ''}
    <span class="t">${esc(t.title)}</span>
    ${dueTag(t)}
    <button class="icon${t.focus ? ' on' : ''}" data-action="focus-task" data-id="${t.id}" title="오늘 집중">${t.focus ? '★' : '☆'}</button>
    <button class="icon" data-action="del-task" data-id="${t.id}" title="삭제">✕</button>
  </li>`;
}
function sortTasks(list) {
  return [...list].sort((a, b) => (a.done - b.done) || ((a.due || '9999') < (b.due || '9999') ? -1 : 1));
}
function taskPanel(area, title = '할 일') {
  const list = sortTasks(state.tasks.filter(t => t.area === area));
  return `<div class="card">
    <h3>${title}</h3>
    <form class="row" data-form="task" data-area="${area}">
      <input class="grow" name="title" placeholder="할 일 추가" required>
      <input type="date" name="due">
      <button class="btn primary">추가</button>
    </form>
    ${list.length ? `<ul class="list">${list.map(t => taskItem(t)).join('')}</ul>` : '<div class="empty">아직 없음</div>'}
  </div>`;
}
function notesPanel(area, placeholder) {
  return `<div class="card"><h3>메모</h3>
    <textarea data-notes="${area}" placeholder="${esc(placeholder)}">${esc(state.notes[area] || '')}</textarea></div>`;
}
function checklist(path, area, title) {
  const list = getPath(path);
  const done = list.filter(s => s.done).length;
  return `<div class="card"><h3>${title}</h3>
    <div class="row small muted"><span>${done} / ${list.length} 완료</span></div>
    ${bar(pct(done, list.length), area)}
    <ul class="list">${list.map(s => `<li class="${s.done ? 'done' : ''}">
      <input type="checkbox" data-action="toggle-step" data-path="${path}" data-id="${s.id}" ${s.done ? 'checked' : ''}>
      <span class="t">${esc(s.title)}</span>
      <button class="icon" data-action="del-item" data-path="${path}" data-id="${s.id}" title="삭제">✕</button></li>`).join('')}
    </ul>
    <form class="row" data-form="step" data-path="${path}" style="margin-top:8px">
      <input class="grow" name="title" placeholder="단계 추가" required><button class="btn">추가</button>
    </form></div>`;
}
function editInput(path, item, field, type = 'text', attrs = '') {
  return `<input type="${type}" data-path="${path}" data-id="${item.id}" data-field="${field}" value="${esc(item[field])}" ${attrs}>`;
}

/* ---------- derived stats ---------- */
function fitnessStats() {
  const wk = weekDates();
  const week = wk.filter(d => state.fitness.log[d]).length;
  const month = Object.keys(state.fitness.log).filter(d => state.fitness.log[d] && d.startsWith(thisMonth())).length;
  let streak = 0, d = new Date();
  if (!state.fitness.log[fmt(d)]) d = addDays(d, -1);
  while (state.fitness.log[fmt(d)]) { streak++; d = addDays(d, -1); }
  return { week, month, streak, goal: Number(state.fitness.goalPerWeek) || 1 };
}
function amazonStats() {
  const m = thisMonth();
  let income = 0, expense = 0, totalIn = 0, totalOut = 0;
  for (const e of state.amazon.ledger) {
    const amt = Number(e.amount) || 0;
    if (e.type === '수입') { totalIn += amt; if (e.date.startsWith(m)) income += amt; }
    else { totalOut += amt; if (e.date.startsWith(m)) expense += amt; }
  }
  const stepsDone = state.amazon.steps.filter(s => s.done).length;
  return { income, expense, net: income - expense, totalNet: totalIn - totalOut, stepsDone, stepsTotal: state.amazon.steps.length };
}
function houseStats() {
  const m = thisMonth();
  const t = state.house.tenants;
  const rentTotal = t.reduce((s, x) => s + (Number(x.rent) || 0), 0);
  const paid = t.filter(x => x.paid && x.paid[m]).length;
  const stepsDone = state.house.steps.filter(s => s.done).length;
  return { count: t.length, rentTotal, paid, stepsDone, stepsTotal: state.house.steps.length };
}
function nextKidEvent() {
  const now = today();
  return [...state.kids.events].filter(e => e.date >= now).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
}

/* ---------- views ---------- */
const VIEWS = {
  today() {
    const now = today();
    const focus = state.tasks.filter(t => t.focus && !t.done);
    const urgent = sortTasks(state.tasks.filter(t => !t.done && !t.focus && t.due && t.due <= now));
    const fs = fitnessStats(), as = amazonStats(), hs = houseStats(), ev = nextKidEvent();
    const careerOpen = state.tasks.filter(t => t.area === 'career' && !t.done).length;
    const goals = state.career.goals;
    const goalAvg = goals.length ? goals.reduce((s, g) => s + Number(g.progress || 0), 0) / goals.length : 0;
    const card = (area, big, sub) => `<div class="card area-card" style="${areaVar(area)}" data-action="go" data-tab="${area}">
      <div class="label">${AREAS[area].icon} ${AREAS[area].label}</div><div class="big">${big}</div><div class="sub">${sub}</div></div>`;
    return `
      <div class="cards">
        ${card('career', `${careerOpen}개 남음`, goals.length ? `목표 평균 ${Math.round(goalAvg)}%` : '목표를 정해보세요')}
        ${card('amazon', `런칭 ${as.stepsDone}/${as.stepsTotal}`, `이번 달 순익 ${won(as.net)}`)}
        ${card('kids', ev ? esc(ev.title) : '일정 없음', ev ? `${ev.date === now ? '오늘' : shortDate(ev.date)} ${esc(ev.time || '')}` : '다가오는 일정 추가')}
        ${card('fitness', `이번 주 ${fs.week}/${fs.goal}`, state.fitness.log[now] ? '오늘 완료 ✓' : `최소: ${esc(state.fitness.minimum)}`)}
        ${card('house', `월세 ${hs.paid}/${hs.count} 입금`, `3번째 테넌트 준비 ${hs.stepsDone}/${hs.stepsTotal}`)}
      </div>
      <div class="grid" style="margin-top:12px">
        <div class="card">
          <h2>오늘 집중할 ${FOCUS_LIMIT}가지</h2>
          <div class="small muted">전부 다 하려고 하지 말고, 각 탭에서 ☆ 를 눌러 최대 ${FOCUS_LIMIT}개만 고르세요.</div>
          ${focus.length ? `<ul class="list">${focus.map(t => taskItem(t, true)).join('')}</ul>` : '<div class="empty" style="margin-top:8px">아직 고른 게 없어요.</div>'}
        </div>
        <div class="card">
          <h2>빠른 추가</h2>
          <form class="stack" data-form="quick">
            <input name="title" placeholder="머릿속에 있는 거 일단 적기" required style="width:100%">
            <div class="row">
              <select name="area">${Object.entries(AREAS).map(([k, a]) => `<option value="${k}">${a.icon} ${a.label}</option>`).join('')}</select>
              <input type="date" name="due">
              <label class="row small"><input type="checkbox" name="focus"> 오늘 집중</label>
              <button class="btn primary">추가</button>
            </div>
          </form>
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <h2>마감 지남 / 오늘 마감</h2>
        ${urgent.length ? `<ul class="list">${urgent.map(t => taskItem(t, true)).join('')}</ul>` : '<div class="empty">없음 👍</div>'}
      </div>`;
  },

  career() {
    const goals = state.career.goals;
    return `<div class="grid">
      <div class="stack">
        <div class="card"><h3>목표</h3>
          ${goals.length ? `<ul class="list">${goals.map(g => `<li style="flex-wrap:wrap">
            <span class="t">${esc(g.title)}</span>
            <span class="tag">${g.progress || 0}%</span>
            <button class="icon" data-action="del-item" data-path="career.goals" data-id="${g.id}">✕</button>
            <input type="range" min="0" max="100" step="5" style="width:100%;accent-color:var(--career)" data-path="career.goals" data-id="${g.id}" data-field="progress" value="${g.progress || 0}">
          </li>`).join('')}</ul>` : '<div class="empty">예: 승진 준비, 이직 포트폴리오, 자격증</div>'}
          <form class="row" data-form="goal" style="margin-top:8px">
            <input class="grow" name="title" placeholder="목표 추가" required><button class="btn">추가</button>
          </form>
        </div>
        ${taskPanel('career')}
      </div>
      ${notesPanel('career', '1:1 미팅 메모, 성과 기록, 배운 것…')}
    </div>`;
  },

  amazon() {
    const s = amazonStats();
    const P = 'amazon.products';
    const products = state.amazon.products;
    const ledger = [...state.amazon.ledger].sort((a, b) => b.date.localeCompare(a.date));
    return `<div class="grid">
      <div class="stack">
        ${checklist('amazon.steps', 'amazon', '런칭 체크리스트')}
        ${taskPanel('amazon')}
      </div>
      <div class="stack">
        <div class="card"><h3>제품 / 마진 계산</h3>
          <div class="scroll-x"><table class="table">
            <tr><th>제품</th><th>단계</th><th>원가</th><th>FBA 수수료</th><th>판매가</th><th>마진</th><th></th></tr>
            ${products.map(p => {
              const margin = (Number(p.price) || 0) - (Number(p.cost) || 0) - (Number(p.fee) || 0);
              const mp = Number(p.price) ? Math.round(margin / p.price * 100) : 0;
              return `<tr>
                <td style="min-width:110px">${editInput(P, p, 'name')}</td>
                <td style="min-width:90px"><select data-path="${P}" data-id="${p.id}" data-field="stage">${options(PRODUCT_STAGES, p.stage)}</select></td>
                <td>${editInput(P, p, 'cost', 'number', 'step="0.01"')}</td>
                <td>${editInput(P, p, 'fee', 'number', 'step="0.01"')}</td>
                <td>${editInput(P, p, 'price', 'number', 'step="0.01"')}</td>
                <td class="${margin >= 0 ? 'pos' : 'neg'}" style="white-space:nowrap">${won(margin)} <span class="small">(${mp}%)</span></td>
                <td><button class="icon" data-action="del-item" data-path="${P}" data-id="${p.id}">✕</button></td></tr>`;
            }).join('')}
          </table></div>
          ${products.length ? '' : '<div class="empty">후보 제품을 추가해서 마진을 비교해보세요.</div>'}
          <button class="btn" data-action="add-product" style="margin-top:8px">+ 제품</button>
          <div class="hint">마진 = 판매가 − 원가(배송·관세 포함) − FBA/리퍼럴 수수료. 광고비 감안하면 30% 이상이 안전해요.</div>
        </div>
        <div class="card"><h3>수입 / 지출</h3>
          <div class="stat"><span>이번 달 수입</span><b class="pos">${won(s.income)}</b></div>
          <div class="stat"><span>이번 달 지출</span><b class="neg">${won(s.expense)}</b></div>
          <div class="stat"><span>이번 달 순익</span><b class="${s.net >= 0 ? 'pos' : 'neg'}">${won(s.net)}</b></div>
          <div class="stat muted small"><span>누적 순익</span><b>${won(s.totalNet)}</b></div>
          <form class="row" data-form="ledger" style="margin-top:8px">
            <input type="date" name="date" value="${today()}" required>
            <select name="type"><option>지출</option><option>수입</option></select>
            <input type="number" name="amount" step="0.01" placeholder="금액" required>
            <input class="grow" name="memo" placeholder="메모 (샘플, 광고비…)">
            <button class="btn primary">기록</button>
          </form>
          ${ledger.length ? `<ul class="list">${ledger.slice(0, 15).map(e => `<li>
            <span class="tag">${shortDate(e.date)}</span><span class="t">${esc(e.memo || e.type)}</span>
            <b class="${e.type === '수입' ? 'pos' : 'neg'}">${e.type === '수입' ? '+' : '−'}${won(e.amount)}</b>
            <button class="icon" data-action="del-item" data-path="amazon.ledger" data-id="${e.id}">✕</button></li>`).join('')}</ul>` : ''}
        </div>
      </div>
    </div>`;
  },

  kids() {
    const now = today();
    const upcoming = [...state.kids.events].filter(e => e.date >= now).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    return `<div class="grid">
      <div class="stack">
        <div class="card"><h3>다가오는 일정</h3>
          <form class="row" data-form="event">
            <input type="date" name="date" value="${now}" required>
            <input type="time" name="time">
            <input class="grow" name="title" placeholder="병원, 학교 행사, 픽업…" required>
            <button class="btn primary">추가</button>
          </form>
          ${upcoming.length ? `<ul class="list">${upcoming.map(e => `<li>
            <span class="tag">${e.date === now ? '오늘' : shortDate(e.date)}${e.time ? ' ' + esc(e.time) : ''}</span>
            <span class="t">${esc(e.title)}</span>
            <button class="icon" data-action="del-item" data-path="kids.events" data-id="${e.id}">✕</button></li>`).join('')}</ul>` : '<div class="empty">예정된 일정 없음</div>'}
        </div>
        ${taskPanel('kids', '할 일 / 살 것')}
      </div>
      ${notesPanel('kids', '성장 기록, 사이즈, 아이가 요즘 좋아하는 것, 같이 하고 싶은 것…')}
    </div>`;
  },

  fitness() {
    const fs = fitnessStats(), now = today(), wk = weekDates();
    const names = ['월', '화', '수', '목', '금', '토', '일'];
    const doneToday = !!state.fitness.log[now];
    return `<div class="grid">
      <div class="stack">
        <div class="card">
          <button class="bigbtn${doneToday ? ' done' : ''}" data-action="workout" data-date="${now}">${doneToday ? '오늘 했음 ✓ (취소하려면 클릭)' : '오늘 운동했다!'}</button>
          <div class="small muted" style="margin-top:8px">최소 버전: <b>${esc(state.fitness.minimum)}</b> — 이것만 해도 체크하세요. 0일보다 10분이 낫습니다.</div>
          <div class="row" style="justify-content:space-between;margin-top:12px"><b>이번 주</b><span class="small muted">${fs.week} / ${fs.goal}회</span></div>
          ${bar(Math.min(100, pct(fs.week, fs.goal)), 'fitness')}
          <div class="week">${wk.map((d, i) => `<button class="${state.fitness.log[d] ? 'on' : ''}${d === now ? ' today' : ''}" data-action="workout" data-date="${d}">${names[i]}</button>`).join('')}</div>
        </div>
        <div class="card">
          <div class="stat"><span>연속 기록</span><b>${fs.streak}일</b></div>
          <div class="stat"><span>이번 달</span><b>${fs.month}회</b></div>
        </div>
      </div>
      <div class="stack">
        <div class="card"><h3>설정</h3>
          <div class="stack">
            <label class="row small">주간 목표 <input type="number" min="1" max="7" data-setting="fitness.goalPerWeek" value="${esc(state.fitness.goalPerWeek)}"> 회</label>
            <label class="small">최소 버전 (하기 싫은 날 기준)<input style="width:100%;margin-top:4px" data-setting="fitness.minimum" value="${esc(state.fitness.minimum)}"></label>
          </div>
          <div class="hint">처음엔 주 2회로 시작해서 4주 연속 달성하면 1회씩 올리세요.</div>
        </div>
        ${taskPanel('fitness')}
      </div>
    </div>`;
  },

  house() {
    const hs = houseStats(), m = thisMonth(), T = 'house.tenants', C = 'house.candidates';
    const target = Number(state.house.targetRent) || 0;
    return `<div class="grid">
      <div class="stack">
        <div class="card"><h3>테넌트 · ${m} 월세</h3>
          <div class="scroll-x"><table class="table">
            <tr><th>이름</th><th>방</th><th>월세</th><th>계약 만료</th><th>입금</th><th></th></tr>
            ${state.house.tenants.map(t => {
              const soon = t.leaseEnd && t.leaseEnd <= fmt(addDays(new Date(), 60));
              return `<tr>
                <td style="min-width:100px">${editInput(T, t, 'name')}</td>
                <td style="min-width:60px">${editInput(T, t, 'room')}</td>
                <td>${editInput(T, t, 'rent', 'number')}</td>
                <td style="min-width:130px">${editInput(T, t, 'leaseEnd', 'date', soon ? 'style="border-color:var(--danger)" title="60일 내 만료"' : '')}</td>
                <td><input type="checkbox" data-action="toggle-rent" data-id="${t.id}" ${t.paid && t.paid[m] ? 'checked' : ''}></td>
                <td><button class="icon" data-action="del-item" data-path="${T}" data-id="${t.id}">✕</button></td></tr>`;
            }).join('')}
          </table></div>
          <button class="btn" data-action="add-tenant" style="margin-top:8px">+ 테넌트</button>
          <div class="stat" style="margin-top:8px"><span>월세 합계 (현재)</span><b>${won(hs.rentTotal)}</b></div>
          <div class="stat"><span>입금 완료</span><b>${hs.paid} / ${hs.count}</b></div>
          <div class="stat"><span>3번째 테넌트 목표 월세</span><input type="number" data-setting="house.targetRent" value="${esc(state.house.targetRent)}"></div>
          ${target ? `<div class="stat muted small"><span>3명 기준 예상 월 수입</span><b>${won(hs.rentTotal + target)}</b></div>` : ''}
        </div>
        <div class="card"><h3>3번째 테넌트 후보</h3>
          <div class="scroll-x"><table class="table">
            <tr><th>이름</th><th>연락처</th><th>단계</th><th>메모</th><th></th></tr>
            ${state.house.candidates.map(c => `<tr>
              <td style="min-width:90px">${editInput(C, c, 'name')}</td>
              <td style="min-width:110px">${editInput(C, c, 'contact')}</td>
              <td style="min-width:100px"><select data-path="${C}" data-id="${c.id}" data-field="stage">${options(CANDIDATE_STAGES, c.stage)}</select></td>
              <td style="min-width:120px">${editInput(C, c, 'memo')}</td>
              <td><button class="icon" data-action="del-item" data-path="${C}" data-id="${c.id}">✕</button></td></tr>`).join('')}
          </table></div>
          ${state.house.candidates.length ? '' : '<div class="empty">문의 오면 여기에 추가</div>'}
          <button class="btn" data-action="add-candidate" style="margin-top:8px">+ 후보</button>
        </div>
      </div>
      <div class="stack">
        ${checklist('house.steps', 'house', '3번째 테넌트 준비')}
        ${taskPanel('house', '수리 / 관리 할 일')}
        ${notesPanel('house', '하우스 룰, 유틸리티 계정, 수리 업체 연락처…')}
      </div>
    </div>`;
  },
};

/* ---------- render ---------- */
function render() {
  const d = new Date();
  document.getElementById('today').textContent =
    d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  document.getElementById('tabs').innerHTML = Object.entries(TABS).map(([k, t]) =>
    `<button class="${state.tab === k ? 'active' : ''}" data-action="go" data-tab="${k}">${t.icon} ${t.label}</button>`).join('');
  document.getElementById('main').innerHTML = (VIEWS[state.tab] || VIEWS.today)();
}
function commit() { save(); render(); }
const findIn = (path, id) => getPath(path).find(x => x.id === id);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id, path } = el.dataset;
  switch (action) {
    case 'go': state.tab = el.dataset.tab; window.scrollTo(0, 0); break;
    case 'toggle-task': { const t = state.tasks.find(x => x.id === id); t.done = !t.done; if (t.done) t.focus = false; break; }
    case 'focus-task': {
      const t = state.tasks.find(x => x.id === id);
      if (!t.focus && state.tasks.filter(x => x.focus && !x.done).length >= FOCUS_LIMIT) {
        alert(`오늘 집중은 ${FOCUS_LIMIT}개까지만! 하나를 끝내거나 빼고 추가하세요.`); return;
      }
      t.focus = !t.focus; break;
    }
    case 'del-task': state.tasks = state.tasks.filter(x => x.id !== id); break;
    case 'toggle-step': { const s = findIn(path, id); s.done = !s.done; break; }
    case 'del-item': {
      if (!confirm('삭제할까요?')) return;
      const arr = getPath(path); arr.splice(arr.findIndex(x => x.id === id), 1); break;
    }
    case 'workout': { const d = el.dataset.date; state.fitness.log[d] = !state.fitness.log[d]; if (!state.fitness.log[d]) delete state.fitness.log[d]; break; }
    case 'add-product': state.amazon.products.push({ id: uid(), name: '', stage: PRODUCT_STAGES[0], cost: '', fee: '', price: '' }); break;
    case 'add-tenant': state.house.tenants.push({ id: uid(), name: '', room: '', rent: 0, leaseEnd: '', paid: {} }); break;
    case 'add-candidate': state.house.candidates.push({ id: uid(), name: '', contact: '', stage: CANDIDATE_STAGES[0], memo: '' }); break;
    case 'toggle-rent': { const t = findIn('house.tenants', id), m = thisMonth(); t.paid = t.paid || {}; t.paid[m] = !t.paid[m]; break; }
    case 'export': return exportData();
    case 'theme': return toggleTheme();
    default: return;
  }
  commit();
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  switch (f.dataset.form) {
    case 'task': state.tasks.push({ id: uid(), area: f.dataset.area, title: v.title.trim(), due: v.due, done: false, focus: false }); break;
    case 'quick': {
      const wantFocus = !!v.focus && state.tasks.filter(x => x.focus && !x.done).length < FOCUS_LIMIT;
      state.tasks.push({ id: uid(), area: v.area, title: v.title.trim(), due: v.due, done: false, focus: wantFocus });
      break;
    }
    case 'step': getPath(f.dataset.path).push({ id: uid(), title: v.title.trim(), done: false }); break;
    case 'goal': state.career.goals.push({ id: uid(), title: v.title.trim(), progress: 0 }); break;
    case 'ledger': state.amazon.ledger.push({ id: uid(), date: v.date, type: v.type, amount: Number(v.amount), memo: v.memo.trim() }); break;
    case 'event': state.kids.events.push({ id: uid(), date: v.date, time: v.time, title: v.title.trim() }); break;
  }
  commit();
});

// Inline edits: update state without re-rendering on every keystroke, re-render on change.
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.notes) { state.notes[el.dataset.notes] = el.value; save(); return; }
  if (el.dataset.path && el.dataset.field) {
    const item = findIn(el.dataset.path, el.dataset.id);
    item[el.dataset.field] = el.type === 'number' || el.type === 'range' ? (el.value === '' ? '' : Number(el.value)) : el.value;
    save();
  }
  if (el.dataset.setting) {
    const keys = el.dataset.setting.split('.'), last = keys.pop();
    keys.reduce((o, k) => o[k], state)[last] = el.type === 'number' ? Number(el.value) : el.value;
    save();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile') return importData(el);
  if ((el.dataset.path && el.dataset.field) || el.dataset.setting) render();
});

/* ---------- backup / theme ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `life-dashboard-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  file.text().then(txt => {
    try {
      const data = JSON.parse(txt);
      if (!confirm('현재 데이터를 백업 파일로 덮어쓸까요?')) return;
      state = deepMerge(defaultState(), data);
      commit();
    } catch (err) { alert('백업 파일을 읽을 수 없어요.'); }
    input.value = '';
  });
}
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(KEY + '.theme', root.dataset.theme); } catch (e) { /* ignore */ }
}
try { const th = localStorage.getItem(KEY + '.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }

render();
</script>
</body>
</html>
